name: Build Windows

on:
  push:
    branches:
      - main
      - build/shared-toolchain
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Electron package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build metadata
        id: meta
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore Electron caches
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}\PyDroidBuildCache\electron
            ${{ runner.temp }}\PyDroidBuildCache\electron-builder
            ${{ runner.temp }}\PyDroidBuildCache\pnpm-store
          key: pydroid-windows-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pydroid-windows-${{ runner.os }}-

      - name: Build Windows package with project toolchain
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'PyDroidWork'
          $tools = Join-Path $env:RUNNER_TEMP 'PyDroidTools'
          $cache = Join-Path $env:RUNNER_TEMP 'PyDroidBuildCache'
          $output = Join-Path $env:RUNNER_TEMP 'PyDroidOutput'
          New-Item -ItemType Directory -Force -Path $work,$tools,$cache,$output | Out-Null
          & .\tools\build-pydroid.ps1 `
            -ProjectRoot $env:GITHUB_WORKSPACE `
            -ToolRoot $tools `
            -CacheRoot $cache `
            -WorkRoot $work `
            -OutputRoot $output `
            -SkipAndroid `
            -NetworkMode Direct

          $desktopPackage = Get-ChildItem -LiteralPath $output -Directory -Filter 'PyDroid-Flow-*-Desktop' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $desktopPackage) {
            throw "Windows build completed without producing a PyDroid-Flow Desktop package."
          }

          # build-pydroid.ps1 accepts robocopy exit codes 0-7 as success. Robocopy commonly
          # leaves LASTEXITCODE=1 when files were copied, so clear it after verifying output.
          $global:LASTEXITCODE = 0

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: PyDroid-Flow-Windows-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: ${{ runner.temp }}\PyDroidOutput\*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows status
        if: always()
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $body = @{ state = $state; context = 'pydroid/windows'; description = "Windows package build $state" } | ConvertTo-Json -Compress
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers $headers -Body $body -ContentType 'application/json'
