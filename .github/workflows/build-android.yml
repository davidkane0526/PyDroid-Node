name: Build Android

on:
  push:
    branches:
      - main
      - build/shared-toolchain
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Ensure Gradle wrapper is executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name APK with version and commit
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "android/app/build/outputs/apk/debug/PyDroid-Flow-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PyDroid-Flow-Android-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: android/app/build/outputs/apk/debug/PyDroid-Flow-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != "success" ]; then state="failure"; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"pydroid/android\",\"description\":\"Android APK build $state\"}"
